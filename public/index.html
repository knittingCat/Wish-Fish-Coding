<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wish Fish Coding — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="fish-big">🐟</div>
      <h1>Wish Fish Coding</h1>
      <p>Your VexCode IQ companion</p>
    </div>

    <div id="alert" class="alert alert-err"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register" id="registerLink">Create one</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const _nextParam = new URLSearchParams(window.location.search).get('next');
  // Already logged in → redirect
  if (getToken()) window.location.href = _nextParam || '/dashboard';
  if (_nextParam) document.getElementById('registerLink').href = '/register?next=' + encodeURIComponent(_nextParam);

  const form    = document.getElementById('loginForm');
  const alertEl = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    alertEl.textContent = msg;
    alertEl.className = 'alert alert-err show';
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    alertEl.className = 'alert';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>';
    try {
      const data = await API.post('/api/auth/login', {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      });
      sessionStorage.setItem('token', data.token);
      sessionStorage.setItem('username', data.username);
      window.location.href = _nextParam || '/dashboard';
    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
